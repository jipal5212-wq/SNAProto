name: Build and Test Full-Stack Docker Container

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Unified Docker Image (Frontend + Backend + RAG Engine)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: snap-platform:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify Docker Container Build Status
      run: |
        echo "=================================================="
        echo "S.N.A.P Unified Container Built Successfully!"
        echo "Ready for production cloud deployment."
        echo "=================================================="
