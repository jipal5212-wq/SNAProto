services:
  - type: web
    name: snap-govtech-platform
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_PATH
        value: /opt/venv/bin/python
      - key: RAG_ENGINE_URL
        value: http://127.0.0.1:8000
      - key: CHROMA_PERSIST_DIR
        value: /app/data/chroma_data
      - key: SQLITE_DB_PATH
        value: /app/data/snap_rag.db
      - key: UPLOAD_DIR
        value: /app/data/uploads
