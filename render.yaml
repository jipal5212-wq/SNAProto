services:
  - type: web
    name: snap-govtech-platform
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: PYTHON_PATH
        value: /opt/venv/bin/python
      - key: RAG_ENGINE_URL
        value: http://127.0.0.1:8000
