version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snap_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/snap_prototype
      - PYTHON_PATH=/opt/venv/bin/python
      - RAG_ENGINE_URL=http://127.0.0.1:8000
      - SESSION_SECRET=snap_govtech_production_secret_2026
    volumes:
      - chroma_data:/app/rag-engine/chroma_data
      - uploads_data:/app/rag-engine/uploads
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: snap_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  chroma_data:
  uploads_data:
